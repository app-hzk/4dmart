<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#16A34A" />
  <meta name="description" content="4D Mart — Katalog produk warung. Pesan mudah via WhatsApp." />

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg" />
  <link rel="apple-touch-icon" href="assets/icon.svg" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="4D Mart" />
  <meta name="mobile-web-app-capable" content="yes" />

  <title>4D Mart — Katalog Produk</title>

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ===== TOP APP BAR ===== -->
  <header class="appbar" id="appbar">
    <div class="appbar__brand">
      <div class="appbar__logo">
        <i class="fas fa-bag-shopping"></i>
      </div>
      <div class="appbar__text">
        <span class="appbar__name">4D Mart</span>
        <span class="appbar__tag">Warung Serba Ada</span>
      </div>
    </div>
    <button class="appbar__action" id="cartBtn" aria-label="Keranjang">
      <i class="fas fa-bag-shopping"></i>
      <span class="appbar__badge" id="cartBadge" hidden>0</span>
    </button>
  </header>

  <!-- ===== SEARCH ===== -->
  <div class="searchbar">
    <div class="searchbar__inner">
      <i class="fas fa-magnifying-glass searchbar__icon"></i>
      <input type="search" id="searchInput" class="searchbar__input" placeholder="Cari produk di 4D Mart..." autocomplete="off" />
      <button class="searchbar__clear" id="searchClear" hidden aria-label="Bersihkan">
        <i class="fas fa-circle-xmark"></i>
      </button>
    </div>
  </div>

  <!-- ===== AD BANNER ===== -->
  <div class="adbar" id="adbar">
    <div class="adbar__inner">
      <span class="adbar__pill"><i class="fas fa-bolt"></i> Promo</span>
      <p class="adbar__text" id="adText">Gratis ongkir untuk pembelian di atas Rp50.000!</p>
    </div>
  </div>

  <!-- ===== CATEGORY CHIPS ===== -->
  <div class="chips" id="chips"></div>

  <!-- ===== CONTENT ===== -->
  <main class="content">
    <div class="content__head">
      <h2 class="content__title">
        <i class="fas fa-store"></i> Produk
      </h2>
      <span class="content__count" id="countText">0 produk</span>
    </div>

    <div class="grid" id="grid"></div>

    <div class="empty" id="empty" hidden>
      <div class="empty__icon"><i class="fas fa-magnifying-glass"></i></div>
      <p class="empty__text">Produk tidak ditemukan</p>
      <p class="empty__hint">Coba kata kunci lain atau ubah kategori</p>
    </div>
  </main>

  <!-- ===== BOTTOM NAV ===== -->
  <nav class="bottomnav">
    <button class="nav-item nav-item--active" data-nav="home">
      <i class="fas fa-house"></i>
      <span>Beranda</span>
    </button>
    <button class="nav-item" data-nav="category">
      <i class="fas fa-layer-group"></i>
      <span>Kategori</span>
    </button>
    <button class="nav-item" data-nav="cart" id="navCart">
      <i class="fas fa-bag-shopping"></i>
      <span>Keranjang</span>
      <span class="nav-item__badge" id="navBadge" hidden>0</span>
    </button>
    <button class="nav-item" data-nav="wa">
      <i class="fab fa-whatsapp"></i>
      <span>Chat</span>
    </button>
  </nav>

  <!-- ===== PRODUCT DETAIL MODAL ===== -->
  <div class="modal" id="modal" hidden>
    <div class="modal__backdrop" data-close></div>
    <div class="modal__panel" role="dialog" aria-modal="true">
      <button class="modal__close" data-close aria-label="Tutup">
        <i class="fas fa-xmark"></i>
      </button>
      <div id="modalContent"></div>
    </div>
  </div>

  <!-- ===== CART DRAWER ===== -->
  <aside class="drawer" id="drawer" hidden>
    <div class="drawer__backdrop" data-close></div>
    <div class="drawer__panel" role="dialog" aria-modal="true">
      <div class="drawer__head">
        <div class="drawer__title">
          <i class="fas fa-bag-shopping"></i> Keranjang
        </div>
        <button class="drawer__close" data-close aria-label="Tutup">
          <i class="fas fa-xmark"></i>
        </button>
      </div>
      <div class="drawer__body" id="cartBody"></div>
      <div class="drawer__foot" id="cartFoot" hidden>
        <div class="drawer__total">
          <span>Total</span>
          <strong id="cartTotal">Rp0</strong>
        </div>
        <button class="btn btn--wa btn--full" id="checkoutBtn">
          <i class="fab fa-whatsapp"></i>
          Pesan via WhatsApp
        </button>
      </div>
    </div>
  </aside>

  <!-- ===== TOAST ===== -->
  <div class="toast" id="toast" hidden>
    <i class="fas fa-circle-check"></i>
    <span id="toastMsg"></span>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
